version: 1
project:
  title: Alejandro Monje Santos
  description: GIS Specialist.
  copyright: '2026'
  keywords:
    - Data Science
    - Open-source Software
    - Machine Learning
  # github: username/repo
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - cv.typ
    - cv.pdf
    - generate_cv.py
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - fonts/**
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  toc:
    - file: index.md
    - file: pages/about.md
    - file: pages/skills.md
    - pattern: blog/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    style: custom.css
    # analytics_google: G-XXXXXXXXXX
    folders: true
  actions:
    - title: RSS
      url: https://opengeos.org/myst-cv-template/rss.xml
  template: book-theme
  parts:
    primary_sidebar_footer: ''
    footer: |
      [CV (PDF)](cv.pdf) |
      [GitHub](https://github.com/username) |
      [LinkedIn](https://www.linkedin.com/in/username)
